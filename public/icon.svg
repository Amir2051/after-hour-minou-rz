<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#34133e"/>
      <stop offset="55%" stop-color="#180a22"/>
      <stop offset="100%" stop-color="#09040e"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4588"/>
      <stop offset="50%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle luxury border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255, 45, 120, 0.25)" stroke-width="2"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="140" fill="rgba(255, 45, 120, 0.12)" filter="url(#neonGlow)"/>

  <!-- Interlocking stylized couples hearts / infinity emblem -->
  <g filter="url(#neonGlow)">
    <!-- Crescent Moon / Left Wing -->
    <path d="M 210,140 C 145,140 100,190 100,250 C 100,320 180,380 256,410 C 230,375 200,320 200,270 C 200,205 230,165 256,150 C 240,144 225,140 210,140 Z" fill="url(#neonPink)" opacity="0.95"/>
    
    <!-- Partner Crescent Moon / Right Wing -->
    <path d="M 302,140 C 367,140 412,190 412,250 C 412,320 332,380 256,410 C 282,375 312,320 312,270 C 312,205 282,165 256,150 C 272,144 287,140 302,140 Z" fill="url(#glowPurple)" opacity="0.92"/>

    <!-- Central Flame / Spark -->
    <path d="M 256,170 C 265,200 285,225 285,250 C 285,275 268,295 256,305 C 244,295 227,275 227,250 C 227,225 247,200 256,170 Z" fill="#ffd1e3"/>
  </g>

  <!-- Subtle star sparkle -->
  <polygon points="256,110 262,126 278,132 262,138 256,154 250,138 234,132 250,126" fill="#fff" opacity="0.9"/>
  <polygon points="370,180 374,192 386,196 374,200 370,212 366,200 354,196 366,192" fill="#ff7da7" opacity="0.8"/>
  <polygon points="142,190 146,200 156,204 146,208 142,218 138,208 128,204 138,200" fill="#c084fc" opacity="0.8"/>
</svg>
