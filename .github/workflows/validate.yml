name: Validate AFTER HOURS

on:
  push:
    branches:
      - main
      - after-hours-upgrade
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Run game engine tests
        run: bun run test
      - name: Build PWA
        run: bun run build
